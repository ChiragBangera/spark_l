
services:
  spark_service:
    build:
      context: . #Path to docker file
    volumes:
      - ./src:/app/src #mounting workspace
      - ./build.sbt:/app/build.sbt
      - ./hive-site.xml:/opt/bitnami/spark/conf/hive-site.xml
    ports:
      - "4040:4040"
      - "7077:7077"
      - "8080:8080"
    working_dir: /app/src
    environment:
      - PYTHONPATH=/app/.venv/lib/python3.12/site-packages
    depends_on:
      - postgres
    tty: true

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hivepassword
      POSTGRES_DB: metastore
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf
      - ./postgresql.conf:/etc/postgresql/postgresql.conf
    command: postgres -c hba_file=/etc/postgresql/pg_hba.conf -c config_file=/etc/postgresql/postgresql.conf


  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      - zookeeper

  hive-metastore:
    image: bde2020/hive:2.3.2-postgresql-metastore
    platform: linux/amd64
    volumes:
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml 
    environment:
      - HIVE_METASTORE_USER=hive
      - HIVE_METASTORE_PASSWORD=hivepassword
      - HIVE_METASTORE_DB_HOST=postgres
      - HIVE_METASTORE_DB_NAME=metastore
    #   - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    command: /opt/hive/bin/hive --service metastore
    ports:
      - "9083:9083"
    depends_on:
      - postgres

  hive-init:
    image: bde2020/hive:2.3.2-postgresql-metastore
    platform: linux/amd64
    volumes:
      - ./hive-site.xml:/opt/hive/conf/hive-site.xml
      - ./core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    command: /opt/hive/bin/schematool -initSchema -dbType postgres
    depends_on:
      - postgres
    restart: "no"



volumes:
  pg_data:

